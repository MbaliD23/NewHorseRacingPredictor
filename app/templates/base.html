<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HorseRacingPredictor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}?v=2">
<script src="{{ url_for('static', path='js/app.js') }}?v=2"></script></head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <nav class="navbar app-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <span class="logo-mark">HR</span>
                <span>HorseRacingPredictor</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a class="status-chip archive-nav" href="/archive">Past races</a>
                <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">☀</button>
                <div class="status-chip">Source: legacy.winningform.co.za</div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
