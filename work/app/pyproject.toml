[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HorseRacingPredictor"
version = "1.0.0"
description = "Live horse racing prediction platform built with FastAPI"
readme = "Documentation/README.md"
requires-python = ">=3.11"
authors = [{name = "Perplexity"}]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0.1",
  "apscheduler>=3.10.4",
  "tenacity>=9.0.0",
  "greenlet>=3.1.1"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
